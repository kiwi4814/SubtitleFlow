[project]
name = "subtitleflow"
version = "0.3.0"
description = "Evidence-driven subtitle polishing, bilingual production, font-safe ASS styling, and MKV remux workflow"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "SubtitleFlow contributors" }]
keywords = ["subtitle", "ass", "srt", "opencode", "mkv", "remux"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.scripts]
subflow = "subtitleflow.cli:main"

[project.optional-dependencies]
yaml = ["PyYAML>=6.0.2,<7"]
opencc = ["opencc-python-reimplemented>=0.1.7,<0.2"]
fonts = ["fonttools>=4.59,<5"]
full = ["PyYAML>=6.0.2,<7", "opencc-python-reimplemented>=0.1.7,<0.2", "fonttools>=4.59,<5"]

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
  "fonttools>=4.59,<5",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
subtitleflow = ["styles/*.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
