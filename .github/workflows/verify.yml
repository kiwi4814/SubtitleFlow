name: verify

on:
  push:
    branches:
      - main
      - feat/evidence-driven-release-system
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive source snapshot
        run: git archive --format=zip HEAD -o source-tree.zip
      - uses: actions/upload-artifact@v4
        with:
          name: source-tree
          path: source-tree.zip
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install renderer dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fontconfig fonts-dejavu-core
      - name: Sync environment
        run: uv sync --all-extras --dev
      - name: Compile
        run: uv run python -m compileall -q src
      - name: Tests
        run: |
          set -o pipefail
          uv run pytest -q | tee pytest.txt
      - name: Build
        run: uv build | tee build.txt
      - name: CLI smoke
        run: uv run subflow doctor --json | tee cli-smoke.txt
      - name: Ruff lint audit
        id: lint
        if: always()
        continue-on-error: true
        run: uv run ruff check . > ruff-lint.txt 2>&1
      - name: Ruff format audit
        id: format
        if: always()
        continue-on-error: true
        run: uv run ruff format --check . > ruff-format.txt 2>&1
      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-diagnostics
          path: |
            pytest.txt
            build.txt
            cli-smoke.txt
            ruff-lint.txt
            ruff-format.txt
          if-no-files-found: ignore
