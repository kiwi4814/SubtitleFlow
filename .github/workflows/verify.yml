name: verify

on:
  push:
    branches:
      - main
      - feat/evidence-driven-release-system
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install renderer dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fontconfig fonts-dejavu-core
      - name: Sync environment
        run: uv sync --all-extras --dev
      - name: Compile
        run: uv run python -m compileall -q src
      - name: Ruff lint
        id: lint
        continue-on-error: true
        run: uv run ruff check . > ruff-lint.txt 2>&1
      - name: Ruff format
        id: format
        continue-on-error: true
        run: uv run ruff format --check . > ruff-format.txt 2>&1
      - name: Upload Ruff diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-diagnostics
          path: |
            ruff-lint.txt
            ruff-format.txt
      - name: Enforce Ruff result
        if: steps.lint.outcome == 'failure' || steps.format.outcome == 'failure'
        run: exit 1
      - name: Tests
        run: uv run pytest -q
      - name: Build
        run: uv build
      - name: CLI smoke
        run: uv run subflow doctor --json
