name: verify

on:
  push:
    branches:
      - main
      - feat/evidence-driven-release-system
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install renderer dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fontconfig fonts-dejavu-core
      - name: Sync environment
        run: uv sync --all-extras --dev
      - name: Compile
        run: uv run python -m compileall -q src
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest -q
      - name: Build
        run: uv build
      - name: CLI smoke
        run: uv run subflow doctor --json
