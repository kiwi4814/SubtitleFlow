name: verify

on:
  push:
    branches:
      - main
      - feat/evidence-driven-release-system
  pull_request:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Sync environment
        run: uv sync --all-extras --dev
      - name: Compile
        run: uv run python -m compileall -q src
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Install renderer dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fontconfig fonts-dejavu-core
      - name: Tests
        run: uv run pytest -q
      - name: M01 real-evidence portable-bundle pilot
        env:
          SUBTITLEFLOW_M01_ARTIFACT_DIR: ${{ runner.temp }}/m01-portable-artifact
        run: uv run python tools/run_m01_artifact_pilot.py
      - name: Upload M01 portable bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: m01-portable-bundle
          path: ${{ runner.temp }}/m01-portable-artifact
          if-no-files-found: error
          retention-days: 14
      - name: Build
        run: uv build
      - name: CLI smoke
        run: uv run subflow --json doctor
